<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1e40af">
  <title>CathyAI</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-dark: #1e3a8a;
      --primary-light: #dbeafe;
      --bg: #f1f5f9;
      --white: #ffffff;
      --text: #1e293b;
      --gray: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); z-index: 10; }
    .header .avatar { width: 36px; height: 36px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
    .header .title { flex: 1; }
    .header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
    .header .status { font-size: 0.7rem; opacity: 0.85; }
    .header .close { color: white; text-decoration: none; font-size: 1.2rem; padding: 4px; }
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
    .msg { display: flex; max-width: 85%; }
    .msg.ai { align-self: flex-start; }
    .msg.user { align-self: flex-end; }
    .bubble { padding: 10px 14px; border-radius: 18px; font-size: 0.95rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .msg.ai .bubble { background: white; border: 1px solid var(--border); border-bottom-left-radius: 6px; }
    .msg.user .bubble { background: var(--primary); color: white; border-bottom-right-radius: 6px; }
    .typing { font-size: 0.8rem; color: var(--gray); padding: 4px 0; }
    .input-bar { padding: 12px 16px; background: white; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
    .input-bar input { flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 24px; font-size: 1rem; outline: none; -webkit-appearance: none; }
    .input-bar input:focus { border-color: var(--primary); }
    .input-bar button { width: 44px; height: 44px; border: none; border-radius: 50%; background: var(--primary); color: white; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
    .input-bar button:disabled { background: var(--gray); }
    .setup { margin: 12px auto; padding: 14px 18px; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 12px; max-width: 90%; font-size: 0.85rem; color: #9a3412; }
    .setup a { color: var(--primary); }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="avatar">🤖</div>
      <div class="title">
        <h1>CathyAI</h1>
        <div class="status" id="cathyai-status">何云熙专属击剑助手</div>
      </div>
      <a href="fencing_tournament_helper.html" class="close">✕</a>
    </div>

    <div id="cathyai-setup" class="setup" style="display:none;">
      <b>CathyAI 还不能用</b><br>
      需要先部署 Cloudflare Worker，并把 Worker URL 填到本文件开头的 <code>CATHY_AI_WORKER_URL</code>。<br>
      教程：<a href="CATHY_AI_SETUP.md" target="_blank">CATHY_AI_SETUP.md</a>
    </div>

    <div id="cathyai-messages" class="messages"></div>

    <div class="input-bar">
      <input id="cathyai-input" type="text" placeholder="问 CathyAI..." autocomplete="off" disabled>
      <button id="cathyai-send" disabled>➤</button>
    </div>
  </div>

  <script>
    // ===================== 配置 =====================
    // 部署 Cloudflare Worker 后，把 URL 填在这里
    const CATHY_AI_WORKER_URL = 'https://cathyfencing.frankataix.workers.dev';
    // ================================================

    function getContext() {
      try {
        const raw = localStorage.getItem('cathy_training_data') || '{}';
        const records = JSON.parse(raw);
        const text = JSON.stringify(records);
        return text.length > 8000 ? text.slice(0, 8000) + '\n...（数据已截断）' : text;
      } catch (e) {
        return '暂无 Cathy 数据';
      }
    }

    const messagesEl = document.getElementById('cathyai-messages');
    const inputEl = document.getElementById('cathyai-input');
    const sendBtn = document.getElementById('cathyai-send');
    const statusEl = document.getElementById('cathyai-status');
    const setupEl = document.getElementById('cathyai-setup');

    function appendMsg(role, text) {
      const row = document.createElement('div');
      row.className = 'msg ' + role;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setTyping(show) {
      let el = document.getElementById('cathyai-typing');
      if (!show) {
        if (el) el.remove();
        return;
      }
      if (!el) {
        el = document.createElement('div');
        el.id = 'cathyai-typing';
        el.className = 'typing';
        el.textContent = 'CathyAI 思考中...';
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
    }

    async function send() {
      const q = inputEl.value.trim();
      if (!q) return;
      inputEl.value = '';
      appendMsg('user', q);
      setTyping(true);
      statusEl.textContent = 'CathyAI 思考中...';
      try {
        const resp = await fetch(CATHY_AI_WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q, context: getContext() })
        });
        const data = await resp.json();
        if (!resp.ok || data.error) throw new Error(data.error || '请求失败');
        appendMsg('ai', data.answer || 'CathyAI 没有回答。');
      } catch (e) {
        appendMsg('ai', '抱歉，出错了：' + e.message);
      }
      setTyping(false);
      statusEl.textContent = '何云熙专属击剑助手';
    }

    if (CATHY_AI_WORKER_URL) {
      inputEl.disabled = false;
      sendBtn.disabled = false;
      appendMsg('ai', '你好，我是 CathyAI。\n\n我可以帮你：\n• 分析 Cathy 的比赛和训练\n• 推荐适合的赛事\n• 解释击剑规则\n• 提醒休息和拉伸\n\n有什么问题随时问我。');
    } else {
      setupEl.style.display = 'block';
      appendMsg('ai', '你好，CathyAI 还没配置好。\n\n请先看 CATHY_AI_SETUP.md 部署 Worker，然后把 Worker URL 填进本文件。');
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
