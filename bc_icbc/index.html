        let mode = 'practice';
        let queue = [];
        let idx = 0;
        let score = 0;
        let answered = false;
        let records = [];

        const app = document.getElementById('app');

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function startPractice() {
            mode = 'practice';
            queue = [...questions].sort((a, b) => a.num - b.num);
            idx = 0;
            score = 0;
            records = [];
            render();
        }

        function startExam() {
            mode = 'exam';
            queue = shuffle(questions).slice(0, 50);
            idx = 0;
            score = 0;
            records = [];
            render();
        }

        function render() {
            const q = queue[idx];
            let html = `
                <div class="top-bar">
                    <span class="category">${q.category || ''}</span>
                    <span class="progress">第 ${idx + 1} / ${queue.length} 题</span>
                </div>
                <div class="question">${q.num}. ${q.question}</div>
                <div class="options" id="options"></div>
                <div class="explanation" id="explanation"></div>
                <div class="controls">
                    <button class="secondary" onclick="prevQuestion()" id="prevBtn" ${idx === 0 ? 'disabled' : ''}>上一题</button>
                    <button onclick="nextQuestion()" id="nextBtn" style="display:none;">下一题</button>
                    <button onclick="finish()" id="finishBtn" style="display:none;">查看成绩</button>
                    <button class="secondary" onclick="showMenu()">退出</button>
                </div>
            `;
            app.innerHTML = html;

            const optsDiv = document.getElementById('options');
            ['A', 'B', 'C', 'D'].forEach(l => {
                if (!q.options[l]) return;
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.id = 'opt-' + l;
                btn.innerHTML = '<b>' + l + '.</b> ' + escapeHtml(q.options[l]);
                btn.onclick = () => select(l);
                optsDiv.appendChild(btn);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function select(l) {
            if (answered) return;
            answered = true;
            const q = queue[idx];
            const correct = l === q.answer;
            if (correct) score++;
            records.push({num: q.num, selected: l, correct: correct});

            ['A', 'B', 'C', 'D'].forEach(letter => {
                const btn = document.getElementById('opt-' + letter);
                if (!btn) return;
                if (letter === q.answer) btn.classList.add('correct');
                else if (letter === l) btn.classList.add('wrong');
                else btn.disabled = true;
                btn.onclick = null;
            });

            const exp = document.getElementById('explanation');
            let msg = '<strong>正确答案：' + q.answer + '</strong>';
            if (q.explanation) msg += '<br>' + escapeHtml(q.explanation);
            if (!correct) msg += '<br><span style="color:#c0392b">您选择了：' + l + '</span>';
            exp.innerHTML = msg;
            exp.style.display = 'block';

            document.getElementById('nextBtn').style.display = idx < queue.length - 1 ? 'inline-block' : 'none';
            document.getElementById('finishBtn').style.display = idx === queue.length - 1 ? 'inline-block' : 'none';
        }

        function nextQuestion() {
            if (idx < queue.length - 1) {
                idx++;
                answered = false;
                render();
            }
        }

        function prevQuestion() {
            if (idx > 0) {
                idx--;
                answered = false;
                render();
            }
        }

        function finish() {
            const total = queue.length;
            const percent = Math.round(score / total * 100);
            let html = '<div class="result">';
            html += '<h2>' + (mode === 'exam' ? '模拟考试结束' : '练习完成') + '</h2>';
            html += '<div class="score">' + score + ' / ' + total + '</div>';
            html += '<p style="font-size:22px;">正确率：' + percent + '%</p>';
            if (mode === 'exam') {
                html += '<p style="font-size:26px;" class="' + (score >= 40 ? 'pass' : 'fail') + '">';
                html += score >= 40 ? '恭喜，通过！' : '未通过，需答对 40 题';
                html += '</p>';
            }

            const wrong = records.filter(r => !r.correct);
            if (wrong.length > 0) {
                html += '<div class="wrong-list"><h3>错题回顾（' + wrong.length + ' 道）</h3><ul>';
                wrong.forEach(r => {
                    const q = questions.find(x => x.num === r.num);
                    html += '<li><b>第 ' + q.num + ' 题</b>：' + escapeHtml(q.question) + '<br>';
                    html += '正确答案：<b>' + q.answer + '</b>，您选：<b>' + r.selected + '</b></li>';
                });
                html += '</ul></div>';
            } else {
                html += '<p style="color:#27ae60;font-size:24px;">全部答对！</p>';
            }

            html += '<div class="controls"><button onclick="showMenu()">返回主菜单</button></div>';
            html += '</div>';
            app.innerHTML = html;
        }

        function showMenu() {
            app.innerHTML = `
                <div class="menu">
                    <button onclick="startPractice()">顺序练习（300 题）</button>
                    <button class="exam" onclick="startExam()">50 题模拟考试（答对 40 题及格）</button>
                </div>
            `;
        }
    </script>
