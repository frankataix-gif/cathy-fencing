name: Update USA Fencing Tournaments

on:
  schedule:
    - cron: '0 */6 * * *'  # UTC 每 6 小时一次 = 每天 4 次
  workflow_dispatch:       # 手动触发

permissions:
  contents: write

concurrency:
  group: update-usa-fencing
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml json5 beautifulsoup4

      - name: Fetch tournaments
        run: python cathy_data/fetch_usa_fencing_tournaments.py --pages 30

      - name: Fetch Cathy results from FencingTracker
        run: python cathy_data/fetch_results.py

      - name: Fetch entry counts and live links
        run: python cathy_data/fetch_tournament_entries.py --workers 5 --ttl 6
        # 该脚本在抓取报名人数的同时，从同一详情页提取 FencingTimeLive 链接，
        # 避免对同一页面重复请求。

      - name: Update HTML
        run: python cathy_data/import_to_html.py

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "auto: update USA Fencing tournaments"
          # 如果远端有用户的本地提交，先 rebase 再推送，避免 fast-forward 冲突
          git pull --rebase origin main || true
          git push
