name: Update tournaments from USA Fencing

on:
  # 每天 07:00 Pacific Standard Time = 15:00 UTC
  schedule:
    - cron: '0 15 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml

      - name: Fetch tournaments from USA Fencing
        run: python cathy_data/fetch_usa_fencing_tournaments.py

      - name: Import tournaments into HTML
        run: python cathy_data/import_to_html.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update tournaments from USA Fencing"
            git push
          fi
