name: Update USA Fencing Tournaments

on:
  schedule:
    - cron: '0 */6 * * *'  # UTC 每 6 小时一次 = 每天 4 次
  workflow_dispatch:       # 手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml

      - name: Fetch tournaments
        run: python cathy_data/fetch_usa_fencing_tournaments.py

      - name: Rename CSV
        run: mv cathy_data/tournaments.csv cathy_data/usa_fencing_all_tournaments.csv

      - name: Update HTML
        run: python cathy_data/import_to_html.py

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "auto: update USA Fencing tournaments"
          git push
